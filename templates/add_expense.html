<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="top-header">
    <div class="logo">Budget<span>Coach</span></div>
</div>

<a href="/dashboard" class="back-btn">← Back</a>

<div class="page-wrap">
    <div class="page-title">Add <span>Expense</span></div>

    <div class="card fade-up" style="max-width: 520px;">

        {% if error %}
        <div class="alert alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form method="post">
            <div class="form-row">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input type="number" name="amount" placeholder="0.00" step="0.01" min="1" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" name="date" value="{{ today }}" required>
                </div>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select name="category" required>
                    <option value="">Select a category</option>
                    <option>Food</option>
                    <option>Travel</option>
                    <option>Shopping</option>
                    <option>Bills</option>
                    <option>Entertainment</option>
                    <option>Healthcare</option>
                    <option>Education</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Note <span style="color:var(--muted); font-size:12px;">(optional)</span></label>
                <input type="text" name="note" placeholder="e.g. Lunch with friends">
            </div>

            <button type="submit" style="width:100%; padding:13px; font-size:15px;">
                Save Expense
            </button>
        </form>
    </div>
</div>
</body>
</html>
