<!DOCTYPE html>
<html>
<head>
    <title>Settings</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<div class="top-header">
    <h1 class="logo">BudgetCoach</h1>
</div>

<a href="/dashboard" class="back-btn">Back</a>

<div class="dashboard-container">

    <h2>Account Settings</h2>
    <p style="font-size:18px; margin-bottom:25px;">
        Current Username: <span style="color:#38bdf8;">{{ username }}</span>
    </p>

    {% if message %}
        <p class="success">{{ message }}</p>
    {% endif %}

    <div class="cards">

        <div class="card-box">
            <h3>Change Username</h3>
            <form method="post">
                <input type="text" name="new_username" placeholder="New Username"><br><br>
                <button type="submit">Update</button>
            </form>
        </div>

        <div class="card-box">
            <h3>Change Password</h3>
            <form method="post">
                <input type="password" name="new_password" placeholder="New Password"><br><br>
                <button type="submit">Update</button>
            </form>
        </div>

        <div class="card-box">
            <h3>Logout Account</h3>
            <br>
            <a href="/logout"><button>Logout</button></a>
        </div>

    </div>

</div>

</body>
</html>
