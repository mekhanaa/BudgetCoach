<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
<div class="auth-box fade-up">
    <div class="auth-logo">BudgetCoach</div>
    <p class="auth-sub">Start tracking. Start saving.</p>

    <h2>Create account</h2>

    {% if error %}
    <div class="alert alert-error">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post">
        <div class="form-group">
            <label>Username <span style="color:var(--muted); font-size:12px;">(min. 3 characters)</span></label>
            <input type="text" name="username" placeholder="Choose a username" required minlength="3">
        </div>
        <div class="form-group">
            <label>Password <span style="color:var(--muted); font-size:12px;">(min. 6 characters)</span></label>
            <input type="password" name="password" placeholder="Choose a strong password" required minlength="6">
        </div>
        <div class="form-group">
            <label>Gender</label>
            <select name="gender" required>
                <option value="">Select gender</option>
                <option value="Female">Female</option>
                <option value="Male">Male</option>
            </select>
        </div>
        <button type="submit" style="width:100%; padding:13px; font-size:15px; margin-top:8px;">
            Create Account
        </button>
    </form>

    <div class="auth-link">
        Already have an account? <a href="/">Login</a>
    </div>
</div>
</body>
</html>
